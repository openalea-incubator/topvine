{% set pyproject = load_file_data("../pyproject.toml", from_recipe_dir=True) %}
{% set project = pyproject["project"] %}
{% set version = environ.get("GIT_DESCRIBE_TAG", "0.0.0") %}

package:
  name: alinea.topvine
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  preserve_egg_dir: True
  number: 1
  script: pip install --no-deps --no-build-isolation -e .

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - openalea.plantgl
    - openalea.mtg

test:
  requires:
    - path
  imports:
    - alinea.topvine
  source_files:
    - test/**

  commands:
    - python -m unittest discover -s test -p "*.py" --ignore=test_aml.py  --ignore=test_stat.py

about:
  home: {{ project.get("urls", {}).get("Homepage", "") }}
  license: {{ project.get("license", "") }}
  summary: {{ project.get("description", "") }}